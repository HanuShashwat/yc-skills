[project]
name = "openyc-skills"
version = "0.1.0"
description = "OpenYC Skills is a static-file generator that extracts actionable startup advice."
authors = [
    {name = "OpenYC Skills Maintainers", email = "maintainers@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
